paths:
  switches_collection:
    get:
      tags: [Switches]
      summary: 列出所有 ARP 來源交換器與各 VRF 最近讀取狀態
      responses:
        '200':
          description: 交換器列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Switch'
    post:
      tags: [Switches]
      summary: 新增一台 ARP 來源交換器（含預設全域 VRF 讀取設定）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchCreateRequest'
      responses:
        '201':
          description: 建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Switch'

  switches_item:
    get:
      tags: [Switches]
      summary: 取得單一交換器詳情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 交換器資料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Switch'
    put:
      tags: [Switches]
      summary: 更新交換器設定（憑證選填，未提供時保留原值）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchUpdateRequest'
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [Switches]
      summary: 刪除交換器並立即移除其名下 ARP 觀測
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 已刪除

  vrf_configs_collection:
    post:
      tags: [Switches]
      summary: 為交換器新增一筆非全域 VRF 讀取設定
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VRFConfigCreateRequest'
      responses:
        '201':
          description: 建立成功

  vrf_configs_item:
    put:
      tags: [Switches]
      summary: 更新 VRF 讀取設定
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: vrfId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VRFConfigCreateRequest'
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [Switches]
      summary: 刪除 VRF 讀取設定（全域預設不可刪）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: vrfId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 已刪除

  vrf_test_read:
    post:
      tags: [Switches]
      summary: 測試單筆 VRF 讀取設定
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: vrfId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 測試結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestReadResult'

  sync_trigger:
    post:
      tags: [Sync]
      summary: 立即同步所有啟用中的交換器
      responses:
        '202':
          description: 已觸發同步

components:
  schemas:
    VRFReadConfig:
      type: object
      required: [id, switch_id, vrf_name, is_default, enabled, last_status, has_credential]
      properties:
        id:
          type: integer
          format: int64
        switch_id:
          type: integer
          format: int64
        vrf_name:
          type: string
        snmp_context:
          type: string
        has_credential:
          type: boolean
          description: 儲存後不回顯明文，僅標示已設定與否
        is_default:
          type: boolean
        enabled:
          type: boolean
        last_poll_at:
          type: string
          format: date-time
          nullable: true
        last_success_at:
          type: string
          format: date-time
          nullable: true
        last_status:
          type: string
          enum: [success, failed, running, pending]
        last_error_class:
          type: string
        last_error_summary:
          type: string
        last_learned_count:
          type: integer

    Switch:
      type: object
      required: [id, name, mgmt_ip, platform, snmp_version, snmp_port, timeout_ms, enabled, role_label, vrf_configs]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        mgmt_ip:
          type: string
        platform:
          type: string
          enum: [ios-xe, nx-os]
        snmp_version:
          type: string
          enum: [v2c, v3]
        snmp_port:
          type: integer
        timeout_ms:
          type: integer
        enabled:
          type: boolean
        role_label:
          type: string
        notes:
          type: string
        has_v3_warning:
          type: boolean
          description: 若未設定額外 VRF 讀取設定，提示可能缺少 VRF 內位址
        vrf_configs:
          type: array
          items:
            $ref: '#/components/schemas/VRFReadConfig'

    SwitchCreateRequest:
      type: object
      required: [name, mgmt_ip, platform, snmp_version]
      properties:
        name:
          type: string
        mgmt_ip:
          type: string
        platform:
          type: string
          enum: [ios-xe, nx-os]
        snmp_version:
          type: string
          enum: [v2c, v3]
        snmp_port:
          type: integer
          default: 161
        timeout_ms:
          type: integer
          default: 3000
        enabled:
          type: boolean
          default: true
        role_label:
          type: string
          default: 核心
        notes:
          type: string
        snmp_community:
          type: string
          format: password
        v3_username:
          type: string
        v3_auth_protocol:
          type: string
          enum: [SHA, SHA256, MD5]
        v3_auth_pass:
          type: string
          format: password
        v3_priv_protocol:
          type: string
          enum: [AES, AES128, DES]
        v3_priv_pass:
          type: string
          format: password

    SwitchUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/SwitchCreateRequest'

    VRFConfigCreateRequest:
      type: object
      required: [vrf_name]
      properties:
        vrf_name:
          type: string
        snmp_context:
          type: string
        snmp_community:
          type: string
          format: password
        enabled:
          type: boolean
          default: true

    TestReadResult:
      type: object
      required: [success, arp_count, subnet_count]
      properties:
        success:
          type: boolean
        arp_count:
          type: integer
        subnet_count:
          type: integer
        error_class:
          type: string
        error_summary:
          type: string
