# 程式碼品質與靜態檢查（Code Quality）
#
# 用途：
#   在「對 main 發出的 pull request」、「推送到 main」以及手動觸發時，
#   執行工作流程語法檢查與各子系統的靜態程式碼分析。
#
# 工作流程執行規則：
#   - workflows 工作：每次均執行，以 actionlint 檢查 .github/workflows/*.yml 語法。
#   - backend 工作  ：僅在出現 src/backend/go.mod 時執行 Go 格式檢查（gofmt）、
#                     go vet 與 golangci-lint。
#   - frontend 工作 ：僅在出現 src/frontend/package.json 時執行 npm ci、
#                     npm run lint 與 npm run format:check。
#   - backend-test 工作 ：與 backend 相同條件，執行 go test -race -count=1 ./...，
#                     含以 Testcontainers 啟動 MariaDB 的整合測試（runner 內建 Docker）。
#   - frontend-test 工作：與 frontend 相同條件，檢查 OpenAPI 產生的型別與 repo 一致、
#                     建置前端，並以 ChromeHeadless 執行單元測試。
#   - gate 工作     ：提供單一固定的必要狀態檢查（required status check）；
#                     任一啟用的檢查或測試失敗、被取消時即失敗。
#
# 初始無程式碼狀態：
#   目前儲存庫僅有規格文件，無 Go 或 Angular 原始碼。detect 工作會正確偵測並
#   略過尚未建立的後端／前端工作，讓 CI 保持通過；待程式碼加入後自動生效。

name: Code Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect subsystems
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has_backend: ${{ steps.check.outputs.has_backend }}
      has_frontend: ${{ steps.check.outputs.has_frontend }}
    steps:
      - name: 取出原始碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 檢查子系統是否存在
        id: check
        shell: bash
        run: |
          set -euo pipefail
          has_backend="false"
          has_frontend="false"

          if [ -f "src/backend/go.mod" ]; then
            has_backend="true"
          fi

          if [ -f "src/frontend/package.json" ]; then
            has_frontend="true"
          fi

          echo "has_backend=${has_backend}" >> "$GITHUB_OUTPUT"
          echo "has_frontend=${has_frontend}" >> "$GITHUB_OUTPUT"

          {
            echo "### 程式碼品質子系統偵測結果"
            echo
            echo "- Go 後端 (src/backend/go.mod)：${has_backend}"
            echo "- Angular 前端 (src/frontend/package.json)：${has_frontend}"
          } >> "$GITHUB_STEP_SUMMARY"

  workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 取出原始碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 下載並驗證 actionlint 二進位檔
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          asset="actionlint_${version}_linux_amd64.tar.gz"
          expected_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${version}/${asset}"
          echo "${expected_sha256}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          rm -f "${asset}"

      - name: 執行 actionlint 語法檢查
        shell: bash
        run: |
          set -euo pipefail
          actionlint -color

  backend:
    name: Backend Quality (Go)
    needs: detect
    if: ${{ needs.detect.outputs.has_backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 取出原始碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 設定 Go 環境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: 檢查程式碼排版（gofmt）
        shell: bash
        working-directory: src/backend
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::以下檔案未符合 gofmt 排版規範："
            echo "${unformatted}"
            exit 1
          fi

      - name: 執行靜態檢查（go vet）
        shell: bash
        working-directory: src/backend
        run: |
          set -euo pipefail
          go vet ./...

      - name: 執行 golangci-lint 檢查
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # 鎖定版本，避免新版規則讓既有程式碼突然無法通過檢查；升級時一併修正新發現的問題。
          version: v2.15.0
          working-directory: src/backend

  frontend:
    name: Frontend Quality (Angular)
    needs: detect
    if: ${{ needs.detect.outputs.has_frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 取出原始碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 設定 Node.js 環境
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/frontend/package*.json

      - name: 安裝前端相依套件
        shell: bash
        working-directory: src/frontend
        run: |
          set -euo pipefail
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: 執行前端語法檢查（Lint）
        shell: bash
        working-directory: src/frontend
        run: |
          set -euo pipefail
          if node -e "const p = require('./package.json'); process.exit(p.scripts && p.scripts.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "package.json 未定義 lint 腳本，略過此步驟"
          fi

      - name: 執行前端排版檢查
        shell: bash
        working-directory: src/frontend
        run: |
          set -euo pipefail
          if node -e "const p = require('./package.json'); process.exit(p.scripts && p.scripts['format:check'] ? 0 : 1)"; then
            npm run format:check
          else
            echo "package.json 未定義 format:check 腳本，略過此步驟"
          fi

  backend-test:
    name: Backend Tests (Go)
    needs: detect
    if: ${{ needs.detect.outputs.has_backend == 'true' }}
    runs-on: ubuntu-latest
    # 本機完整執行約 5 分鐘；CI 另需下載 MariaDB 映像並啟用 race detector，保留餘裕。
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 取出原始碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 設定 Go 環境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: 確認 Docker 可用（整合測試以 Testcontainers 啟動 MariaDB）
        shell: bash
        run: |
          set -euo pipefail
          docker version

      - name: 執行後端測試（含整合測試與 race detector）
        shell: bash
        working-directory: src/backend
        run: |
          set -euo pipefail
          # -json 輸出供下一步整理失敗清單；失敗時下一步會印出失敗測試的完整輸出
          go test -race -count=1 -json ./... > "${RUNNER_TEMP}/go-test.json"

      - name: 列出失敗的後端測試
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          f="${RUNNER_TEMP}/go-test.json"
          if [ ! -s "$f" ]; then
            echo "::error::沒有測試輸出，可能是編譯失敗"
            exit 0
          fi
          # 印出失敗測試的完整輸出，並在摘要列出失敗測試名稱
          jq -r 'select(.Action=="fail") | "\(.Package) \(.Test // "(套件層級)")"' "$f" | sort -u > "${RUNNER_TEMP}/failed.txt"
          while read -r pkg test; do
            echo "::group::失敗：${pkg} ${test}"
            if [ "$test" = "(套件層級)" ]; then
              jq -j --arg p "$pkg" 'select(.Package==$p and (.Test==null) and .Action=="output") | .Output' "$f"
            else
              jq -j --arg p "$pkg" --arg t "$test" 'select(.Package==$p and .Test==$t and .Action=="output") | .Output' "$f"
            fi
            echo "::endgroup::"
            echo "::error::後端測試失敗：${pkg} ${test}"
          done < "${RUNNER_TEMP}/failed.txt"
          {
            echo "### 失敗的後端測試"
            echo
            sed 's/^/- /' "${RUNNER_TEMP}/failed.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-test:
    name: Frontend Tests (Angular)
    needs: detect
    if: ${{ needs.detect.outputs.has_frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 取出原始碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 設定 Node.js 環境
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/frontend/package*.json

      - name: 安裝前端相依套件
        shell: bash
        working-directory: src/frontend
        run: |
          set -euo pipefail
          npm ci

      - name: 檢查 OpenAPI 產生的前端型別與 repo 一致
        shell: bash
        working-directory: src/frontend
        run: |
          set -euo pipefail
          npm run generate:api
          # repo 內的型別檔經 Prettier 排版，比對前先套用相同排版
          npx prettier --write src/app/core/api.types.ts
          if ! git diff --exit-code -- src/app/core/api.types.ts; then
            echo "::error::src/app/core/api.types.ts 與 docs/api/openapi.yaml 不一致，請執行 npm run generate:api 後以 Prettier 排版再提交"
            exit 1
          fi

      - name: 建置前端
        shell: bash
        working-directory: src/frontend
        run: |
          set -euo pipefail
          npm run build

      - name: 執行前端單元測試（ChromeHeadless）
        shell: bash
        working-directory: src/frontend
        run: |
          set -euo pipefail
          npm test

  gate:
    name: Code Quality gate
    if: ${{ always() }}
    needs:
      - detect
      - workflows
      - backend
      - frontend
      - backend-test
      - frontend-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 確認工作流程與程式碼品質檢查結果
        shell: bash
        env:
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_TEST_RESULT: ${{ needs.backend-test.result }}
          FRONTEND_TEST_RESULT: ${{ needs.frontend-test.result }}
        run: |
          set -euo pipefail
          echo "Workflows lint 結果：${WORKFLOWS_RESULT}"
          echo "Backend lint 結果：${BACKEND_RESULT}"
          echo "Frontend lint 結果：${FRONTEND_RESULT}"
          echo "Backend tests 結果：${BACKEND_TEST_RESULT}"
          echo "Frontend tests 結果：${FRONTEND_TEST_RESULT}"

          # workflows 必須成功
          if [ "${WORKFLOWS_RESULT}" != "success" ]; then
            echo "::error::工作流程語法檢查失敗"
            exit 1
          fi

          # backend 若有執行（非 skipped），必須為 success
          if [ "${BACKEND_RESULT}" != "success" ] && [ "${BACKEND_RESULT}" != "skipped" ]; then
            echo "::error::後端程式碼品質檢查失敗 (${BACKEND_RESULT})"
            exit 1
          fi

          # frontend 若有執行（非 skipped），必須為 success
          if [ "${FRONTEND_RESULT}" != "success" ] && [ "${FRONTEND_RESULT}" != "skipped" ]; then
            echo "::error::前端程式碼品質檢查失敗 (${FRONTEND_RESULT})"
            exit 1
          fi

          # backend-test 若有執行（非 skipped），必須為 success
          if [ "${BACKEND_TEST_RESULT}" != "success" ] && [ "${BACKEND_TEST_RESULT}" != "skipped" ]; then
            echo "::error::後端測試失敗 (${BACKEND_TEST_RESULT})"
            exit 1
          fi

          # frontend-test 若有執行（非 skipped），必須為 success
          if [ "${FRONTEND_TEST_RESULT}" != "success" ] && [ "${FRONTEND_TEST_RESULT}" != "skipped" ]; then
            echo "::error::前端測試失敗 (${FRONTEND_TEST_RESULT})"
            exit 1
          fi

          echo "所有啟用的品質檢查與測試均已順利通過。"
